set-option -g default-terminal "tmux-256color"

# Do not use left/right margins (DECSLRM). tmux enables them for WezTerm, and
# WezTerm 20240203 draws them wrong: scrolling one pane leaves blank gaps or
# stale text in the pane next to it.
set -as terminal-overrides ',*:Enmg@:Dsmg@:Clmg@:Cmg@'

bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

set -g focus-events on

# 'on', not the default 'external', so a nested tmux (local or over ssh) can set the clipboard too
set -g set-clipboard on

set -g base-index 1

unbind C-b
set -g prefix C-f
bind C-f send-prefix

set -g mouse on

set -sg escape-time 0

bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration Reloaded!"

bind | split-window -h -c "#{pane_current_path}"

bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

# Clear the shell with Ctrl+Alt+L, because vim-tmux-navigator takes Ctrl+L.
# When the pane runs a nested tmux (local or over ssh), pass the key on unchanged:
# a plain C-l would be taken by the inner tmux's vim-tmux-navigator.
bind-key -n C-M-l if-shell -F '#{m/r:^(ssh|mosh-client|tmux)$,#{pane_current_command}}' "send-keys C-M-l" "send-keys C-l"

source ~/dotfiles/.config/tmux/tmuxline_theme

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Must stay at the very bottom of tmux.conf
run '~/.config/tmux/plugins/tpm/tpm'
