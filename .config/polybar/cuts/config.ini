[global/wm]
margin-bottom = 0

margin-top = 0

include-file = ~/.config/polybar/cuts/bars.ini
include-file = ~/.config/polybar/cuts/colors.ini
include-file = ~/.config/polybar/cuts/modules.ini
include-file = ~/.config/polybar/cuts/user_modules.ini

[bar/main]
monitor =

monitor-fallback =

; XRandR sometimes reports the monitor as disconnected while in use
monitor-strict = false

override-redirect = false

bottom = false

fixed-center = true

width = 100%
height = 28

offset-x = 0%
offset-y = 0%

background = ${color.background-alt}

foreground = ${color.foreground}

radius-top = 0.0
radius-bottom = 0.0

line-size = 2
line-color = ${color.primary}

border-size = 0
border-color = ${color.primary}

padding = 0

module-margin-left = 0
module-margin-right = 0

font-0 = "Terminus:size=10;3"
font-1 = "waffle:size=10;3"
; For powerline glyphs
font-2 = Iosevka Nerd Font:style=Medium:size=19;3
; Larger size for the bar fill icons (%{T4} in bars.ini)
font-3 = Iosevka Nerd Font:style=Medium:size=12;4
; Small size for shorter spaces
font-4 = Iosevka Nerd Font:style=Medium:size=7;4

[bar/top]
inherit = bar/main
modules-left = launcher workspaces
modules-right = network cpu memory filesystem temperature battery volume brightness date sysmenu
enable-ipc = true

separator =

dim-value = 1.0

wm-name = 

locale = 

tray-position = none

tray-detached = false

tray-maxsize = 16

tray-background = ${color.background-alt}

tray-offset-x = 0
tray-offset-y = 0

tray-padding = 0

tray-scale = 1.0

click-left = 
click-middle = 
click-right =
scroll-up =
scroll-down =
double-click-left =
double-click-middle =
double-click-right =

cursor-click = 
cursor-scroll = 

[settings]
throttle-output = 5
throttle-output-for = 10

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
