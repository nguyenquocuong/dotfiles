[tools]
# Runtimes
node = "24"
# 3.15 is days old; many AI wheels (torch, etc.) do not ship for it yet
python = "3.14"
go = "latest"
# `mise bootstrap` evaluates tap casks without API metadata (aerospace) with Ruby 3+
ruby = "3.4"

# Kubernetes and IaC
kubectl = "latest"
helm = "latest"
kind = "latest"
k9s = "latest"
opentofu = "latest"

# Supply chain and security scanners
trivy = "latest"
syft = "latest"
grype = "latest"
cosign = "latest"
gitleaks = "latest"
semgrep = "latest"
hadolint = "latest"
shellcheck = "latest"
pre-commit = "latest"

# Secrets and utilities
sops = "latest"
age = "latest"
yq = "latest"
act = "latest"

# Coding agents without a uyfb adapter, to capture their screens
"npm:@google/gemini-cli" = "latest"
# aider pins scipy 1.15, which has no wheels for Python 3.13+
"pipx:aider-chat" = { version = "latest", uvx_args = "--python 3.12" }

# Local LLMs on Apple Silicon (mlx_lm.generate, mlx_lm.server, ...)
"pipx:mlx-lm" = "latest"

[settings]
# Activate the .venv that uv creates in a project
python.uv_venv_auto = "source"

[bootstrap.brew.taps]
"nikitabobko/tap" = "https://github.com/nikitabobko/homebrew-tap.git"
"felixkratz/formulae" = "https://github.com/felixkratz/homebrew-formulae.git"

[bootstrap.packages]
# Shell and CLI
"brew:fish" = "latest"
"brew:tmux" = "latest"
"brew:neovim" = "latest"
"brew:git" = "latest"
"brew:gh" = "latest"
"brew:gitui" = "latest"
"brew:just" = "latest"
"brew:bat" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:jq" = "latest"
"brew:ripgrep" = "latest"
"brew:tree" = "latest"
"brew:zoxide" = "latest"
"brew:htop" = "latest"
"brew:dust" = "latest"
"brew:telnet" = "latest"
# macOS ships openrsync, which lacks rsync 3's resume and progress
"brew:rsync" = "latest"
# nvim-treesitter builds parsers with it
"brew:tree-sitter-cli" = "latest"

# Toolchains that stay outside [tools]
"brew:mise" = "latest"
# rustup owns the Rust toolchains; mise's rust backend only wraps it
"brew:rustup" = "latest"
"brew:cargo-nextest" = "latest"
# Linux C cross toolchain: `cargo zigbuild --target x86_64-unknown-linux-gnu` checks uyfb's Linux-only code on macOS
"brew:zig" = "latest"
"brew:cargo-zigbuild" = "latest"
# Python packages and venvs; mise provides the interpreter
"brew:uv" = "latest"
# CEF's C++ wrapper (the `cef` crate, uyfb's web pane) builds with cmake and Ninja
"brew:cmake" = "latest"
"brew:ninja" = "latest"

# Containers: colima runs the Docker VM, docker is only the client
"brew:colima" = "latest"
"brew:docker" = "latest"
"brew:docker-compose" = "latest"

# Cloud
"brew:awscli" = "latest"

# iOS
"brew:xcodes" = "latest"
"brew:aria2" = "latest"

# Network
# tailscaled runs as a boot daemon so the Mac is reachable without a GUI login:
#   sudo brew services start tailscale
"brew:tailscale" = "latest"

# Desktop
"brew:felixkratz/formulae/borders" = "latest"
"brew-cask:nikitabobko/tap/aerospace" = "latest"
"brew-cask:wezterm" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"

# Apps
"brew-cask:zen" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:microsoft-teams" = "latest"
"brew-cask:ngrok" = "latest"
"brew-cask:claude-code" = "latest"
"brew-cask:codex" = "latest"

# Arch Linux
# Not applied yet: copied from the old `just install_pkgs`
"pacman:mise" = "latest"
"pacman:gtk2" = "latest"
"pacman:less" = "latest"
"pacman:lxsession-gtk3" = "latest"
"pacman:xorg-server" = "latest"
"pacman:git" = "latest"
"pacman:gitui" = "latest"
"pacman:github-cli" = "latest"
"pacman:alacritty" = "latest"
"pacman:tmux" = "latest"
"pacman:rofi" = "latest"
"pacman:dunst" = "latest"
