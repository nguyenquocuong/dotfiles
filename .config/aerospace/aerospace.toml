# AeroSpace config, ported from ~/dotfiles/.config/i3/config.
# Mod key is alt (Option), because cmd conflicts with macOS app shortcuts.
# Docs: https://nikitabobko.github.io/AeroSpace/guide
config-version = 2

start-at-login = true
auto-reload-config = true
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Like i3: empty workspaces disappear.
persistent-workspaces = []

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 4
gaps.inner.vertical = 4
gaps.outer.left = 0
gaps.outer.bottom = 0
gaps.outer.top = 0
gaps.outer.right = 0

# Workspaces 1-10 on the main monitor, 11-20 on the second one (like i3 $mon1/$mon2).
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'main'
10 = 'main'
11 = 'secondary'
12 = 'secondary'
13 = 'secondary'
14 = 'secondary'
15 = 'secondary'
16 = 'secondary'
17 = 'secondary'
18 = 'secondary'
19 = 'secondary'
20 = 'secondary'

[mode.main.binding]
# Apps
alt-enter = 'exec-and-forget /opt/homebrew/bin/wezterm cli --no-auto-start spawn --new-window || open -a WezTerm'
alt-w = 'exec-and-forget open -a Zen'
alt-e = 'exec-and-forget open ~'

# Kill focused window
alt-shift-q = 'close'
alt-q = 'close'

# Focus
alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-j = 'focus --boundaries all-monitors-outer-frame down'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'
alt-left = 'focus --boundaries all-monitors-outer-frame left'
alt-down = 'focus --boundaries all-monitors-outer-frame down'
alt-up = 'focus --boundaries all-monitors-outer-frame up'
alt-right = 'focus --boundaries all-monitors-outer-frame right'
alt-o = 'focus-monitor --wrap-around next'

# Move window
alt-shift-h = 'move --boundaries all-monitors-outer-frame left'
alt-shift-j = 'move --boundaries all-monitors-outer-frame down'
alt-shift-k = 'move --boundaries all-monitors-outer-frame up'
alt-shift-l = 'move --boundaries all-monitors-outer-frame right'
alt-shift-left = 'move --boundaries all-monitors-outer-frame left'
alt-shift-down = 'move --boundaries all-monitors-outer-frame down'
alt-shift-up = 'move --boundaries all-monitors-outer-frame up'
alt-shift-right = 'move --boundaries all-monitors-outer-frame right'

# Layout
alt-space = 'layout floating tiling'
alt-f = 'fullscreen'
alt-shift-t = 'layout accordion horizontal' # i3: layout tabbed
alt-shift-s = 'layout accordion vertical'   # i3: layout stacking
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Resize (i3 used these keys for gaps, AeroSpace cannot change gaps at runtime)
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspaces
alt-tab = 'workspace-back-and-forth'
alt-ctrl-left = 'workspace --wrap-around prev'
alt-ctrl-right = 'workspace --wrap-around next'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
alt-shift-0 = 'move-node-to-workspace --focus-follows-window 10'
alt-ctrl-1 = 'workspace 11'
alt-ctrl-2 = 'workspace 12'
alt-ctrl-3 = 'workspace 13'
alt-ctrl-4 = 'workspace 14'
alt-ctrl-5 = 'workspace 15'
alt-ctrl-6 = 'workspace 16'
alt-ctrl-7 = 'workspace 17'
alt-ctrl-8 = 'workspace 18'
alt-ctrl-9 = 'workspace 19'
alt-ctrl-0 = 'workspace 20'
alt-ctrl-shift-1 = 'move-node-to-workspace --focus-follows-window 11'
alt-ctrl-shift-2 = 'move-node-to-workspace --focus-follows-window 12'
alt-ctrl-shift-3 = 'move-node-to-workspace --focus-follows-window 13'
alt-ctrl-shift-4 = 'move-node-to-workspace --focus-follows-window 14'
alt-ctrl-shift-5 = 'move-node-to-workspace --focus-follows-window 15'
alt-ctrl-shift-6 = 'move-node-to-workspace --focus-follows-window 16'
alt-ctrl-shift-7 = 'move-node-to-workspace --focus-follows-window 17'
alt-ctrl-shift-8 = 'move-node-to-workspace --focus-follows-window 18'
alt-ctrl-shift-9 = 'move-node-to-workspace --focus-follows-window 19'
alt-ctrl-shift-0 = 'move-node-to-workspace --focus-follows-window 20'

# Reload config (i3: reload / restart)
alt-shift-c = 'reload-config'
alt-shift-r = 'reload-config'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# App rules (i3: assign / for_window)
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = 'layout floating'
