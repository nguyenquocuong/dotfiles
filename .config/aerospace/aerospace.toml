# Mod key is alt (Option), because cmd conflicts with macOS app shortcuts.
config-version = 2

start-at-login = true
auto-reload-config = true
after-startup-command = ['exec-and-forget /opt/homebrew/bin/borders active_color=0xffffffff inactive_color=0x00000000 width=2.0 style=round hidpi=on order=above']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Like i3: empty workspaces disappear.
persistent-workspaces = []

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 4
gaps.inner.vertical = 4
gaps.outer.left = 4
gaps.outer.bottom = 4
gaps.outer.top = 4
gaps.outer.right = 4

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'main'
10 = 'main'
B = 'main'
T = 'main'
11 = 'secondary'
12 = 'secondary'
13 = 'secondary'
14 = 'secondary'
15 = 'secondary'
16 = 'secondary'
17 = 'secondary'
18 = 'secondary'
19 = 'secondary'
20 = 'secondary'

[mode.main.binding]
# Spawning into the running WezTerm focuses its existing window first,
# so AeroSpace puts the new window on that window's workspace.
alt-enter = 'exec-and-forget open -na WezTerm --args start --always-new-process'
alt-w = 'exec-and-forget open -a Zen'
alt-e = 'exec-and-forget open ~'

alt-shift-q = 'close'
alt-q = 'close'

alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-j = 'focus --boundaries all-monitors-outer-frame down'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'
alt-o = 'focus-monitor --wrap-around next'

alt-shift-h = 'move --boundaries all-monitors-outer-frame left'
alt-shift-j = 'move --boundaries all-monitors-outer-frame down'
alt-shift-k = 'move --boundaries all-monitors-outer-frame up'
alt-shift-l = 'move --boundaries all-monitors-outer-frame right'

alt-space = 'layout floating tiling'
alt-shift-f = 'fullscreen'
alt-shift-s = 'layout accordion vertical'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# i3 used these keys for gaps, but AeroSpace cannot change gaps at runtime
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-tab = 'workspace-back-and-forth'
alt-ctrl-left = 'workspace --wrap-around prev'
alt-ctrl-right = 'workspace --wrap-around next'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-1 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh focus 1'
alt-2 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh focus 2'
alt-3 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh focus 3'
alt-4 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh focus 4'
alt-5 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh focus 5'
alt-6 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh focus 6'
alt-7 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh focus 7'
alt-8 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh focus 8'
alt-9 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh focus 9'
alt-0 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh focus 10'
alt-shift-1 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh move 1'
alt-shift-2 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh move 2'
alt-shift-3 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh move 3'
alt-shift-4 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh move 4'
alt-shift-5 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh move 5'
alt-shift-6 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh move 6'
alt-shift-7 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh move 7'
alt-shift-8 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh move 8'
alt-shift-9 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh move 9'
alt-shift-0 = 'exec-and-forget ~/dotfiles/scripts/aerospace-workspace.sh move 10'
alt-b = 'workspace B'
alt-shift-b = 'move-node-to-workspace --focus-follows-window B'
alt-t = 'workspace T'
alt-shift-t = 'move-node-to-workspace --focus-follows-window T'
alt-ctrl-1 = 'workspace 11'
alt-ctrl-2 = 'workspace 12'
alt-ctrl-3 = 'workspace 13'
alt-ctrl-4 = 'workspace 14'
alt-ctrl-5 = 'workspace 15'
alt-ctrl-6 = 'workspace 16'
alt-ctrl-7 = 'workspace 17'
alt-ctrl-8 = 'workspace 18'
alt-ctrl-9 = 'workspace 19'
alt-ctrl-0 = 'workspace 20'
alt-ctrl-shift-1 = 'move-node-to-workspace --focus-follows-window 11'
alt-ctrl-shift-2 = 'move-node-to-workspace --focus-follows-window 12'
alt-ctrl-shift-3 = 'move-node-to-workspace --focus-follows-window 13'
alt-ctrl-shift-4 = 'move-node-to-workspace --focus-follows-window 14'
alt-ctrl-shift-5 = 'move-node-to-workspace --focus-follows-window 15'
alt-ctrl-shift-6 = 'move-node-to-workspace --focus-follows-window 16'
alt-ctrl-shift-7 = 'move-node-to-workspace --focus-follows-window 17'
alt-ctrl-shift-8 = 'move-node-to-workspace --focus-follows-window 18'
alt-ctrl-shift-9 = 'move-node-to-workspace --focus-follows-window 19'
alt-ctrl-shift-0 = 'move-node-to-workspace --focus-follows-window 20'

# Keep both i3 keys (reload and restart); AeroSpace has only reload-config
alt-shift-c = 'reload-config'
alt-shift-r = 'reload-config'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = ['layout floating', 'move-node-to-workspace T']
