# `just config` runs `mise trust --all` so it also trusts .config/mise/config.toml,
# which mise reads as project config until ~/.config/mise exists

[dotfiles]
"~/.gitconfig" = { source = ".gitconfig" }
"~/.config/fish" = { source = ".config/fish" }
"~/.config/omf" = { source = ".config/omf" }
"~/.config/wezterm" = { source = ".config/wezterm" }
"~/.config/nvim" = { source = ".config/nvim" }
"~/.config/mise" = { source = ".config/mise" }
"~/.config/tmux/tmux.conf" = { source = ".config/tmux/tmux.conf" }

# Other tools install skills into ~/.claude/skills too, so link each custom skill
# folder on its own (symlink-each would link every file inside instead)
"~/.claude/CLAUDE.md" = { source = ".claude/CLAUDE.md" }
"~/.claude/statusline.sh" = { source = "scripts/claude-statusline.sh" }
"~/.claude/skills/uyfb" = { source = ".claude/skills/uyfb" }

"~/.config/aerospace" = { source = ".config/aerospace", variants = [{ os = "macos" }] }

"~/.xinitrc" = { source = ".xinitrc", variants = [{ os = "linux" }] }
"~/.config/alacritty" = { source = ".config/alacritty", variants = [{ os = "linux" }] }
"~/.config/dunst" = { source = ".config/dunst", variants = [{ os = "linux" }] }
"~/.config/i3" = { source = ".config/i3", variants = [{ os = "linux" }] }
"~/.config/picom" = { source = ".config/picom", variants = [{ os = "linux" }] }
"~/.config/rofi" = { source = ".config/rofi", variants = [{ os = "linux" }] }
